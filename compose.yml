services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    secrets:
      - service_account.json
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://transit:transit@postgres:5432/transit
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/service_account.json
      - JWT_EXPIRES_IN=7d
      - JWT_SECRET=d7facc60a041d13f4dbe25128a673a78
      - CORS_ORIGIN=http://localhost:3000

  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/docker,
      # so the volume is mounted one level up. A volume created by postgres:14
      # cannot be read by 18: dump it first, or `docker compose down -v`.
      - postgres_data_hub:/var/lib/postgresql
    environment:
      - POSTGRES_USER=transit
      - POSTGRES_PASSWORD=transit
      - POSTGRES_DB=transit

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    secrets:
      - service_account.json
    command: node dist/worker/scheduler.js
    depends_on:
      - backend
    environment:
      - DATABASE_URL=postgres://transit:transit@postgres:5432/transit
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/service_account.json # this need to be removed later
      - URL_SERVER=http://backend:3000

volumes:
  postgres_data_hub:
secrets:
  service_account.json:
    file: ./backend/serviceAccountKey.json